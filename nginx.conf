server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/javascript;

    # --- SPA fallback: every non-file route serves index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Hashed build assets: immutable, cache for a year ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Service worker: must never be served from cache ---
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # --- PWA manifest ---
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # --- APK downloads (large files) ---
    location /downloads/ {
        try_files $uri =404;
    }
}
