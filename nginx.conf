server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (server baseline) ---
    include /etc/nginx/conf.d/nginx-security-headers.conf;

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/javascript;

    # --- Public app shell / SPA fallback ---
    # HTML must always be revalidated: without a Cache-Control header browsers
    # guess a lifetime and can keep showing an old index.html (and so old code)
    # after a deploy. ETags keep the revalidation cheap.
    location / {
        # Re-include the security headers: declaring Cache-Control below
        # switches off header inheritance from the server block.
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # --- Hashed build assets: immutable, cache for a year ---
    location /assets/ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Service worker: must never be served from cache ---
    location = /sw.js {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # --- PWA manifest ---
    location = /manifest.webmanifest {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # --- APK downloads (large files) ---
    location /downloads/ {
        include /etc/nginx/conf.d/nginx-security-headers.conf;
        try_files $uri =404;
    }
}
