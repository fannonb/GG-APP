<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" font-family="Inter, Arial, sans-serif">
  <title>GG'APP: Care now. Pay over time.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F4FD"/>
      <stop offset="1" stop-color="#CDE8FA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="720" cy="520" r="150" fill="#A8D8F5" fill-opacity="0.45"/>
  <circle cx="610" cy="600" r="90" fill="#A8D8F5" fill-opacity="0.35"/>
  <text font-size="52" font-weight="700" fill="#091C44">
    <tspan x="80" y="200">Care now.</tspan>
    <tspan x="80" y="264">Pay over time.</tspan>
  </text>
  <text font-size="24" fill="#3A4A6B">
    <tspan x="80" y="330">Use your GG'APP allocation at verified</tspan>
    <tspan x="80" y="362">clinics, pharmacies and labs.</tspan>
  </text>
  <rect x="80" y="404" width="200" height="56" rx="28" ry="28" fill="#0B7BC0"/>
  <text x="180" y="440" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Find care</text>
</svg>
