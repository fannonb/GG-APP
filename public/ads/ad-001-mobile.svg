  <circle cx="780" cy="-22" r="170" fill="#38B6FF" opacity="0.07"/>
  <circle cx="680" cy="172" r="110" fill="#38B6FF" opacity="0.04"/>
  <!-- Logo tile -->
  <rect x="18" y="52" width="46" height="46" rx="8" fill="#38B6FF"/>
  <text x="41" y="82" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="17" font-weight="bold" fill="#050E22" text-anchor="middle">HS</text>
  <!-- Headline -->
  <text x="80" y="78" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" letter-spacing="-0.3">Protect your family&#x2019;s health</text>
  <!-- Advertiser sub-label -->
  <text x="80" y="97" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="12" fill="#FFFFFF" opacity="0.52">HealthShield Medical Aid</text>
  <!-- CTA button -->
