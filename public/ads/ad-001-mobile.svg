  <text x="651" y="80" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="12" font-weight="bold" fill="#050E22" text-anchor="middle">Get Covered &#x2192;</text>
  <!-- AD label -->
  <text x="744" y="11" font-family="system-ui,-apple-system,Arial,sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" opacity="0.25" text-anchor="end" letter-spacing="1">AD</text>
</svg>
