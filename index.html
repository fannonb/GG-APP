<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1E42" />
    <meta name="description" content="GG'APP — Healthcare Access Platform" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GG'APP" />
    <title>GG'APP — Healthcare Access Platform</title>
    <link rel="preload" href="/fonts/neue-montreal/NeueMontreal-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/neue-montreal/NeueMontreal-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Neue Montreal ships in two weights. The ranges route the app's in-between
         weights: 300–500 render Regular, 600–900 render Bold (no faux bolding). */
      @font-face {
        font-family: 'Neue Montreal';
        src: url('/fonts/neue-montreal/NeueMontreal-Regular.woff2') format('woff2'),
             url('/fonts/neue-montreal/NeueMontreal-Regular.woff') format('woff');
        font-weight: 300 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Neue Montreal';
        src: url('/fonts/neue-montreal/NeueMontreal-Bold.woff2') format('woff2'),
             url('/fonts/neue-montreal/NeueMontreal-Bold.woff') format('woff');
        font-weight: 600 900;
        font-style: normal;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      /* Phones: 16px text stops iOS Safari zooming into fields; taller fields are easier to tap. */
      @media (max-width: 639px) {
        input, select, textarea { font-size: 16px !important; }
        .gg-input { min-height: 48px; }
        /* Neue Montreal's built-in line height is 1.2, which crowds text that wraps on narrow
           screens. Components that set their own lineHeight keep it. Buttons don't inherit
           line-height from body, so they get a slightly tighter value of their own. */
        body { line-height: 1.45; }
        button { line-height: 1.3; }
      }
      body {
        font-family: 'Neue Montreal', 'Helvetica Neue', Arial, sans-serif;
        background: #EEF4FB;
        -webkit-font-smoothing: antialiased;
      }
      .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .admin-nav-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
      .admin-nav-scroll::-webkit-scrollbar { width: 6px; }
      .admin-nav-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 6px; }
      .admin-nav-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.38); }
      .admin-nav-scroll::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
