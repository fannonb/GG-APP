<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1E42" />
    <meta name="description" content="GG'APP — Healthcare Access Platform" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GG'APP" />
    <title>GG'APP — Healthcare Access Platform</title>
    <link rel="preload" href="/fonts/neue-montreal/NeueMontreal-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/neue-montreal/NeueMontreal-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Neue Montreal ships in two weights. The ranges route the app's in-between
         weights: 300–500 render Regular, 600–900 render Bold (no faux bolding). */
      @font-face {
        font-family: 'Neue Montreal';
        src: url('/fonts/neue-montreal/NeueMontreal-Regular.woff2') format('woff2'),
             url('/fonts/neue-montreal/NeueMontreal-Regular.woff') format('woff');
        font-weight: 300 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Neue Montreal';
        src: url('/fonts/neue-montreal/NeueMontreal-Bold.woff2') format('woff2'),
             url('/fonts/neue-montreal/NeueMontreal-Bold.woff') format('woff');
        font-weight: 600 900;
        font-style: normal;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      /* Phones: 16px text stops iOS Safari zooming into fields; taller fields are easier to tap. */
      @media (max-width: 639px) {
        input, select, textarea { font-size: 16px !important; }
        .gg-input { min-height: 48px; }
      }
      body {
        font-family: 'Neue Montreal', 'Helvetica Neue', Arial, sans-serif;
        background: #EEF4FB;
        -webkit-font-smoothing: antialiased;
      }
      .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .admin-nav-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
      .admin-nav-scroll::-webkit-scrollbar { width: 6px; }
      .admin-nav-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.22); border-radius: 6px; }
      .admin-nav-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.38); }
      .admin-nav-scroll::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var bootState = {
          mounted: false,
          errors: [],
        }

        window.__GG_APP_BOOT__ = bootState

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
        }

        function showBootFailure(reason) {
          if (bootState.mounted) return

          var existing = document.getElementById('gg-app-boot-error')
          var details = bootState.errors.length
            ? '<pre style="margin-top:12px;white-space:pre-wrap;font-size:12px;line-height:1.55;color:#2E3E5C;background:#FAF6F5;border:1px solid #EAE6E5;border-radius:10px;padding:12px;max-height:220px;overflow:auto;">' + escapeHtml(bootState.errors.join('\n\n')) + '</pre>'
            : ''

          var markup =
            '<div id="gg-app-boot-error" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#EEF4FB;font-family:Neue Montreal,Helvetica Neue,Arial,sans-serif;">' +
              '<div style="width:min(560px,100%);background:#fff;border:1px solid #EAE6E5;border-radius:20px;box-shadow:0 20px 50px rgba(13,30,66,0.08);padding:24px 22px;">' +
                '<div style="font-size:24px;font-weight:800;letter-spacing:-0.015em;color:#091C44;margin-bottom:10px;">App failed to load</div>' +
                '<div style="font-size:14px;line-height:1.6;color:#2E3E5C;">' + escapeHtml(reason) + '</div>' +
                '<div style="font-size:13px;line-height:1.6;color:#2E3E5C;margin-top:8px;">Try reloading this page after the dev server is running. If it keeps happening, the error details below should help pinpoint the failing script.</div>' +
                details +
                '<button onclick="window.location.reload()" style="margin-top:16px;padding:12px 16px;border:0;border-radius:12px;background:#38B6FF;color:#091C44;font-size:14px;font-weight:700;cursor:pointer;">Reload</button>' +
              '</div>' +
            '</div>'

          if (existing) {
            existing.outerHTML = markup
            return
          }

          var root = document.getElementById('root')
          if (root) {
            root.innerHTML = markup
          } else {
            document.body.insertAdjacentHTML('beforeend', markup)
          }
        }

        window.addEventListener('error', function (event) {
          var message = event && event.message ? event.message : 'Unknown startup error'
          bootState.errors.push('Error: ' + message)
        })

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason
          bootState.errors.push('Unhandled rejection: ' + (reason && reason.stack ? reason.stack : String(reason)))
        })

        window.setTimeout(function () {
          if (!bootState.mounted) {
            showBootFailure('The startup bundle did not mount the React app within a few seconds.')
          }
        }, 4000)

        // Service worker lifecycle (registration, dev cleanup) is handled
        // in src/services/pwa.ts once the app mounts.
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
