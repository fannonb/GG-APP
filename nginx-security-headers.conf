# GG'APP security-response headers, shared by every location in nginx.conf.
#
# nginx drops server-level `add_header` directives inside any location that
# declares its own `add_header`, so the header set lives here as one include
# that every location (and the server block) pulls in — single source of truth.
#
# CSP design (SPA on app gatewayglobal.africa, API at api.gatewayglobal.africa):
#   script-src 'self'      — the boot script (public/boot.js) and Vite's hashed
#                            modules are all external files; no inline scripts
#                            are shipped, so injected inline scripts never run.
#   style-src 'self' 'unsafe-inline' — inline font block in index.html and
#                            React's inline styles require it (standard SPA
#                            trade-off; styles can't exfiltrate data on their
#                            own).
#   img-src  data: blob: https: — server-provided news/ad/attachment images are
#                            arbitrary https hosts; data:/blob: cover inline
#                            attachments and object-URL previews.
#   blob:  in img-src AND child-src — invoice/prescription previews and
#                            downloads are opened from revoked object URLs.
#   connect-src — API host, the OSRM distance router, Nominatim geocoding, and the web-push
#                            service subscription endpoint (FCM). VAPID keys
#                            change the push endpoint; keep 'fcm.googleapis.com'
#                            (and its Google fallback domains) covered.
#   frame-ancestors 'none' + X-Frame-Options DENY — the app is never framed
#                            (blocks clickjacking of the admin portals).
#
# New third-party hosts (e.g. a CDN) must be added to BOTH nginx AND the
# Vercel copy of this header block (vercel.json).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# The API issues and navigations happen over TLS only (Railway terminates and
# forces HTTPS in front of this server; keep-alive :80 sockets stay behind it).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.gatewayglobal.africa https://router.project-osrm.org https://nominatim.openstreetmap.org https://fcm.googleapis.com https://*.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' blob:; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
